apiVersion: apps/v1
kind: Deployment
metadata:
  name: msvc-usuarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: msvc-usuarios
  strategy: {}
  template:
    metadata:
      labels:
        app: msvc-usuarios
    spec:
      containers:
      - image: zvalentinoz/usuarios:latest
        name: usuarios
        ports:
        - containerPort: 8001
        env:
          - name: SPRING_DATASOURCE_URL
            value: jdbc:mysql://mysql8:3306/msvc_usuarios
          - name: SPRING_DATASOURCE_USERNAME
            value: root
          - name: SPRING_DATASOURCE_PASSWORD
            value: escorpion
        resources: {}
status: {}
