apiVersion: apps/v1
kind: Deployment
metadata:
  name: msvc-usuarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: msvc-usuarios
  strategy: {}
  template:
    metadata:
      labels:
        app: msvc-usuarios
    spec:
      containers:
      - image: zvalentinoz/usuarios:latest
        name: usuarios
        ports:
        - containerPort: 8001
        env:
          - name: PORT
            valueFrom:
              configMapKeyRef:
                name: msvc-usuarios
                key: port
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: msvc-usuarios
                key: db_host
          - name: DATABASE
            valueFrom:
              configMapKeyRef:
                name: msvc-usuarios
                key: database
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              configMapKeyRef:
                name: msvc-usuarios
                key: username
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              configMapKeyRef:
                name: msvc-usuarios
                key: password
          - name: CURSO_URL
            valueFrom:
              configMapKeyRef:
                name: msvc-usuarios
                key: curso_url
        resources: {}
status: {}
